# Replace BOTH values with strong secrets before apply.
# Production app startup rejects these placeholders.
# Do not commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: demomonitor-secrets
  namespace: demomonitor
type: Opaque
stringData:
  FLASK_SECRET_KEY: "replace-with-long-random-secret"
  ADMIN_PASSWORD: "replace-with-strong-admin-password"
