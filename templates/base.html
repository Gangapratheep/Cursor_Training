<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} · DemoMonitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  {% if session.get('user_id') %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">Demo<span>Monitor</span></a>
    <nav class="topnav" aria-label="Primary">
      <a href="{{ url_for('home') }}">Dashboard</a>
      <span class="nav-muted">Add server</span>
      <span class="user-chip">{{ session.get('username') }}</span>
      <a class="ghost" href="{{ url_for('logout') }}">Sign out</a>
    </nav>
  </header>
  {% endif %}

  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
