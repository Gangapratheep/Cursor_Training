{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="form-panel">
  <p class="eyebrow">Inventory</p>
  <h1>{{ title }}</h1>
  <p class="lede">Use auth type <code>local</code> for this machine, or SSH password/key for remote Linux hosts.</p>

  <form method="post" class="auth-form server-form" autocomplete="off">
    <label>
      Display name
      <input type="text" name="display_name" required
             value="{{ server.display_name if server else '' }}">
    </label>
    <label>
      Hostname / IP
      <input type="text" name="hostname" required placeholder="127.0.0.1"
             value="{{ server.hostname if server else '' }}">
    </label>
    <label>
      SSH port
      <input type="number" name="ssh_port" min="1" max="65535"
             value="{{ server.ssh_port if server else 22 }}">
    </label>
    <label>
      Auth type
      <select name="auth_type" id="auth_type">
        {% set at = server.auth_type if server else 'local' %}
        <option value="local" {% if at == 'local' %}selected{% endif %}>local</option>
        <option value="password" {% if at == 'password' %}selected{% endif %}>password</option>
        <option value="key" {% if at == 'key' %}selected{% endif %}>key</option>
      </select>
    </label>
    <label>
      SSH username
      <input type="text" name="ssh_username"
             value="{{ server.ssh_username if server and server.ssh_username != 'local' else '' }}"
             placeholder="ubuntu">
    </label>
    <label>
      SSH password
      {# Never echo stored password — blank keeps existing on edit #}
      <input type="password" name="ssh_password" value=""
             placeholder="{% if server and server.ssh_password %}•••••••• (unchanged if blank){% else %}Optional for key; required for password auth{% endif %}">
    </label>
    <label>
      SSH private key path (local file)
      <input type="text" name="ssh_key_path"
             value="{{ server.ssh_key_path if server and server.ssh_key_path else '' }}"
             placeholder="/home/you/.ssh/id_rsa">
    </label>
    <div class="form-actions">
      <button type="submit" class="btn primary">Save</button>
      <a class="btn ghost-btn" href="{{ url_for('servers.home') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
